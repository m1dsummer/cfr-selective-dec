name: Release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        type: string
      release_name:
        description: "Release name. Defaults to the tag when empty"
        required: false
        type: string
      body:
        description: "Release notes"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_BODY: ${{ inputs.body }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_TAG
            $name = $env:INPUT_RELEASE_NAME
            $body = $env:INPUT_BODY
          } else {
            $tag = $env:REF_NAME
            $name = $env:REF_NAME
            $body = ""
          }

          if ([string]::IsNullOrWhiteSpace($name)) {
            $name = $tag
          }

          if ([string]::IsNullOrWhiteSpace($body)) {
            $tagType = (git cat-file -t "refs/tags/$tag").Trim()
            if ($tagType -eq "tag") {
              $body = (git for-each-ref "refs/tags/$tag" --format="%(contents)" | Out-String).Trim()
            }
          }

          if ([string]::IsNullOrWhiteSpace($body)) {
            $previousTag = git tag --merged $tag --sort=-v:refname |
              Where-Object { $_ -ne $tag -and $_ -match '^v?\d+\.\d+\.\d+$' } |
              Select-Object -First 1

            if ([string]::IsNullOrWhiteSpace($previousTag)) {
              $commits = @(git log --reverse --pretty=format:"- %s (%h)" $tag)
            } else {
              $commits = @(git log --reverse --pretty=format:"- %s (%h)" "${previousTag}..${tag}")
            }

            if ($commits.Count -eq 0) {
              $body = "更新内容：`n`n- 未检测到新的提交说明。"
            } else {
              $body = "更新内容：`n`n$($commits -join "`n")"
            }
          }

          $delimiter = "EOF_$([Guid]::NewGuid().ToString('N'))"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: ${{ steps.release_meta.outputs.body }}
          files: |
            target/cfr-selective-dec.jar
